[package]
name = "bevy_burn_dino"
description = "Bevy demo for burn_dino DINOv2 inference"
version = "0.3.0"
edition = "2021"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
keywords = [
  "bevy",
  "burn",
  "dino",
  "nokhwa",
]
categories = [
  "computer-vision",
]
homepage = "https://github.com/mosure/burn_dino"
repository = "https://github.com/mosure/burn_dino"
default-run = "bevy_burn_dino"
exclude = [
  "Cargo.lock",
]


[features]
default = ["native"]

fusion_backend = ["burn/fusion"]

native = ["futures", "nokhwa", "fusion_backend"]
web = []

editor = []
perftest = []



[dependencies]
bevy_args = { version = "4.0", default-features = false }
bevy_burn = { path = "../bevy_burn", version = "0.5.0" }
burn_dino = { path = "../../", version = "0.8.0", default-features = false }
clap = { version = "4.5", features = ["derive"] }
futures = { version = "0.3", optional = true }
futures-intrusive = "0.5"
image = { version = "0.25.2", default-features = false, features = ["png"] }
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"], optional = true }
once_cell = "1.19"
serde = "1.0"


[dependencies.bevy]
version = "0.19"
default-features = false
features = [
  "bevy_asset",
  "bevy_camera",
  "bevy_core_pipeline",
  "bevy_image",
  "bevy_log",
  "bevy_pbr",
  "bevy_render",
  "bevy_sprite",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_window",
  "bevy_winit",
  "debug",
  "default_font",
  "png",
  "std",
  "tonemapping_luts",
  "webgpu",
  "x11",
  "zstd_rust",
]

[dependencies.burn]
version = "0.21"
default-features = false
features = [
  # "autotune",
  # "fusion",
  "std",
  # "template",
  # "wgpu",
]

[dependencies.burn-cubecl-fusion]
version = "0.21"
default-features = false
features = [
  "std",
  # "std",
]


[dependencies.burn-wgpu]
version = "0.21"
default-features = false
features = [
  "fusion",
  # "std",
  # "template",
]

# [dependencies.cubecl]
# version = "0.8"
# default-features = false
# features = [
#   "std",
#   # "template",
# ]

# [dependencies.cubecl-runtime]
# version = "0.8"
# default-features = false
# features = [
#   # "std",
#   "channel-mpsc",
#   # "template",
# ]


[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"


[dependencies.web-sys]
version = "0.3"
features = [
  'Document',
  'Element',
  'HtmlElement',
  'Location',
  'Node',
  'Request',
  'RequestInit',
  'RequestMode',
  'Response',
  'Window',
]


[lib]
path = "src/lib.rs"

[[bin]]
name = "bevy_burn_dino"
path = "src/main.rs"
